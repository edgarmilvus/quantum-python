book: "Quantum Python"
chapter: 17
title: "Dynamic Circuits"
subtitle: "Measurement in the middle, a gate that depends on it, and the ancilla that decides"

invariant: >
  Feed-forward lets a circuit correct itself while it runs, and on this device the
  mechanism works while the arithmetic does not: the syndrome is three times dirtier
  than the data it diagnoses, so correction adds the errors it was meant to remove.

audience:
  reader: "Senior software engineer. Finished chapters 1 to 16. Knows what a syndrome is."
  assumes:
    - "the repetition code and its vote (chapter 16)"
    - "readout asymmetry (chapters 12 and 16)"
    - "shots and their error (chapter 5)"
  does_not_assume: ["dynamic circuit transpilation", "control-flow hardware", "decoders"]

structure:
  - Opening (3 paragraphs, no headings)
  - Theoretical Foundations (11 subsections)
  - Basic Code Example
  - Common Pitfalls (12)
  - Advanced Application Implementation
  - How to run it
  - Reading a Transcript
  - Practical Exercises (requirements only)
  - Solutions (five-part Instructor's Analysis)
  - What this chapter established

theory_subsections:
  - "The task: correct the state, not the histogram"
  - "A mid-circuit measurement is a branch, not a sample"
  - "Control flow is a classical computer inside the shot"
  - "The syndrome extraction, gate by gate"
  - "The correction table, and the three values it compares"
  - "What the runtime refuses, and why"
  - "The injection test: proving the mechanism"
  - "The budget: the syndrome must be cleaner than the data"
  - "Latency is free; false syndromes are not"
  - "What this chapter does not claim"
  - "Decision table: post-hoc, in-circuit, or neither"

artifacts:
  - chapters/chapter17/files/dyn/circuit.py
  - chapters/chapter17/files/dyn/sim.py
  - chapters/chapter17/files/dyn/__init__.py
  - chapters/chapter17/files/01_syndrome.py
  - chapters/chapter17/files/02_collapse.py
  - chapters/chapter17/files/03_inject.py
  - chapters/chapter17/files/04_latency.py
  - chapters/chapter17/files/05_budget.py
  - chapters/chapter17/files/run_ex17.py
  - chapters/chapter17/files/exercises/ex1_table.py
  - chapters/chapter17/files/exercises/ex2_rounds.py
  - chapters/chapter17/files/exercises/ex3_budget.py
  - chapters/chapter17/files/exercises/ex4_partial.py
  - chapters/chapter17/files/exercises/plan_core.py
  - chapters/chapter17/files/exercises/plan_render.py
  - chapters/chapter17/files/exercises/ex5_dynamic.py
  - chapters/chapter17/files/exercises/selfcheck.py
  - chapters/chapter17/files/exercises/run_exercises.py

gates:
  harness: "python3 chapters/chapter17/files/run_ex17.py"
  harness_expected: "38/38 checks passed"
  exercises: "python3 chapters/chapter17/files/exercises/run_exercises.py"
  exercises_expected: "60/60 exercise checks passed"

words: { target: 16000, floor: 14000 }

api_surface:
  circuit: ["memory", "syndrome", "measure_ancillas", "correction", "prepare", "inject", "qubits", "clbits"]
  sim: ["run_shot", "sample", "histogram", "syndrome_histogram", "collapse"]

exercises:
  - id: 1
    title: "A correction table with two rows swapped"
    kind: repair
    files: [ex1_table.py]
    tests: 10
    problem: "The swapped table corrects the wrong qubit, turns one flip into two, and looks harmless on a clean codeword."
  - id: 2
    title: "A second round, and the reset that makes it possible"
    kind: extend
    files: [ex2_rounds.py]
    tests: 15
    problem: "An ancilla left in its measured state adds the previous syndrome to the next one."
  - id: 3
    title: "The syndrome's own error rate is the whole budget"
    kind: measure
    files: [ex3_budget.py]
    tests: 10
    problem: "A clean codeword produces a false syndrome 6.3% of the time against a data error of 1.9%."
  - id: 4
    title: "A correction that tests one syndrome and ignores the rest"
    kind: break
    files: [ex4_partial.py]
    tests: 11
    problem: "One row still fixes the encoder's favourite error, and the logical bit hides the two it misses."
  - id: 5
    title: "One report that separates repair from rate"
    kind: integrate
    files: [plan_core.py, plan_render.py, ex5_dynamic.py]
    tests: 14
    problem: "The codeword is repaired 90% of the time and the logical rate still gets worse, and the verdict has to say both."

multi_file_exercise:
  id: 5
  files: [plan_core.py, plan_render.py, ex5_dynamic.py]
  why: >
    plan_core.py is pure (a histogram and a bit in, two rates out), plan_render.py formats,
    ex5_dynamic.py reads the two recorded runs and pairs each with its control.

figures:
  - "the dynamic circuit: prepare, extract, measure, correct"
  - "a mid-circuit measurement as a branch"
  - "the injection test, control against correction"
  - "latency is free, false syndromes are not"
  - "the syndrome's error rate against the data's"

runs:
  - "runs/chapter17/0031-dynamic-correction-4096-ibm/result.json (8 circuits, memory)"
  - "runs/chapter17/0032-inject-one-flip-4096-ibm/result.json (6 circuits, injection)"
  - "runs/chapter17/0033-latency-conditional-4096-ibm/result.json (3 circuits, latency probe)"
  - "runs/chapter17/0034-syndrome-two-registers-8192-ibm/result.json (2 circuits, both registers)"

chapter_notes: >
  Four device runs, all on ibm_kingston or ibm_marrakesh. The injection test proves the
  feed-forward works, the latency probe shows the round trip is free, the syndrome run gives
  the 6.3% false rate, and the memory run shows the correction losing to the control.
