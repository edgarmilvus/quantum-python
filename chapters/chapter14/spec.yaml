book: "Quantum Python"
chapter: 14
title: "Annealing and the D-Wave Problem"
subtitle: "QUBO, chains, and the numbers a machine that is not here would change"

invariant: >
  An annealer minimizes an Ising energy by sampling from a temperature schedule,
  so the answer depends on the schedule, on the embedding and on the chain
  strength as much as on the problem.

audience:
  reader: "Senior software engineer. Finished chapters 1 to 13. Has met MaxCut and a cost function."
  assumes:
    - "MaxCut and its QUBO form (chapter 13)"
    - "a sampler returns distributions, not single answers (chapters 5 and 13)"
    - "the cost of a run in seconds and reads (chapters 11 to 13)"
  does_not_assume: ["statistical mechanics", "minor embedding algorithms", "D-Wave's SDK"]

structure:
  - Opening (3 paragraphs, no headings)
  - Theoretical Foundations (11 subsections)
  - Basic Code Example
  - Common Pitfalls (12)
  - Advanced Application Implementation
  - How to run it
  - Reading a Transcript
  - Practical Exercises (requirements only)
  - Solutions (five-part Instructor's Analysis)
  - What this chapter established

theory_subsections:
  - "The task: three instances, one machine"
  - "Ising and QUBO are the same function"
  - "MaxCut as a QUBO, and why the diagonal matters"
  - "A constraint is a penalty, and a penalty has a threshold"
  - "The annealer's model: a spin, a field, and a temperature"
  - "The schedule decides what you find"
  - "Chains: one logical variable on several qubits"
  - "Chain strength has a window, not a value"
  - "Reads, seconds, and the arithmetic of confidence"
  - "What a D-Wave run would add, and what it would not"
  - "Decision table: anneal, simulate, or reformulate"

artifacts:
  - chapters/chapter14/files/anneal/qubo.py
  - chapters/chapter14/files/anneal/sampler.py
  - chapters/chapter14/files/anneal/embed.py
  - chapters/chapter14/files/anneal/instances.py
  - chapters/chapter14/files/anneal/__init__.py
  - chapters/chapter14/files/01_qubo.py
  - chapters/chapter14/files/02_anneal.py
  - chapters/chapter14/files/03_embed.py
  - chapters/chapter14/files/04_reads.py
  - chapters/chapter14/files/05_dwave.py
  - chapters/chapter14/files/run_ex14.py
  - chapters/chapter14/files/exercises/ex1_diagonal.py
  - chapters/chapter14/files/exercises/ex2_penalty.py
  - chapters/chapter14/files/exercises/ex3_chain.py
  - chapters/chapter14/files/exercises/ex4_schedule.py
  - chapters/chapter14/files/exercises/plan_core.py
  - chapters/chapter14/files/exercises/plan_render.py
  - chapters/chapter14/files/exercises/ex5_anneal.py
  - chapters/chapter14/files/exercises/selfcheck.py
  - chapters/chapter14/files/exercises/run_exercises.py

gates:
  harness: "python3 chapters/chapter14/files/run_ex14.py"
  harness_expected: "63/63 checks passed"
  exercises: "python3 chapters/chapter14/files/exercises/run_exercises.py"
  exercises_expected: "75/75 exercise checks passed"

words: { target: 18000, floor: 14000 }

api_surface:
  qubo: ["qubo_from_maxcut", "energy", "to_ising", "ising_energy", "to_qubo", "brute_force", "penalty_qubo", "add", "report"]
  sampler: ["Result", "Exact", "Annealer", "ising_energy", "local_field", "flip_delta", "reads_for", "success_rate"]
  embed: ["Chimera", "validate", "physical_problem", "unembed", "chain_break_fraction", "five_variable_instance"]
  instances: ["maxcut_square", "spin_glass", "frustrated_ring"]

exercises:
  - id: 1
    title: "A QUBO that forgot its diagonal"
    kind: repair
    files: [ex1_diagonal.py]
    tests: 11
    problem: "Keeping only the off-diagonal terms makes the energy +2 where the cut is 4, and its minimum is the all-zero assignment."
  - id: 2
    title: "A constraint is a penalty, and a penalty has a price"
    kind: extend
    files: [ex2_penalty.py]
    tests: 14
    problem: "At most one vertex on side 1 switches the optimum at a penalty of exactly 1.0, which is the gain the second vertex buys."
  - id: 3
    title: "The chain strength that is neither too weak nor too strong"
    kind: measure
    files: [ex3_chain.py]
    tests: 14
    problem: "0.2 breaks one chain in five, 1.0 breaks none and wins every read, 4.0 breaks none and still loses a quarter."
  - id: 4
    title: "Two ways to freeze in the wrong basin"
    kind: break
    files: [ex4_schedule.py]
    tests: 18
    problem: "One sweep succeeds 3.5% of the time and a cold start loses twenty points to a hot one."
  - id: 5
    title: "One report from a direct run and an embedded one"
    kind: integrate
    files: [plan_core.py, plan_render.py, ex5_anneal.py]
    tests: 18
    problem: "The same summary must read a twelve-variable run and a five-variable run that went through chains."

multi_file_exercise:
  id: 5
  files: [plan_core.py, plan_render.py, ex5_anneal.py]
  why: >
    plan_core.py is pure (a result and an optimum in, a verdict out), plan_render.py formats,
    ex5_anneal.py builds both samplers and unembeds the physical one.

figures:
  - "the pipeline from a graph to an answer"
  - "the temperature schedule and the energy trace"
  - "the logical graph and its chains on Chimera C(2,2)"
  - "three chain strengths and the two failures"
  - "reads needed against the per-read success rate"

runs:
  - "runs/0024-chapter14-local (no QPU: D-Wave issued no token in 2026)"

chapter_notes: >
  No D-Wave machine was run. The Trial plan stopped issuing tokens in 2026, so the chapter
  teaches the formulation, the embedding and the sampler contract, and states in the last
  demo exactly which numbers a QPU would change. Every number is local, deterministic and
  reproducible; the 20 microsecond anneal time is the one hardware parameter, and it is named
  as an assumption wherever it is used.
