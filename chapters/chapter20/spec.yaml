book: "Quantum Python"
chapter: 20
title: "The Last Experiment"
subtitle: "Teleporting a state, correcting in the open, and proving it arrived"

invariant: >
  Teleportation moves a state with a Bell measurement and two classical bits; the only
  honest demonstration is a corrected receiving qubit measured in three bases, with the
  uncorrected run as the control and the shot error as the error bar.

audience:
  reader: "Senior software engineer. Finished chapters 1 to 19. Has run a circuit, corrected a readout, and read a benchmark."
  assumes:
    - "entanglement and the Bell basis (chapter 2)"
    - "readout correction (chapters 12 and 19)"
    - "dynamic circuits and mid-circuit measurement (chapter 17)"
  does_not_assume: ["tomography", "quantum communication", "density matrices"]

structure:
  - Opening (3 paragraphs, no headings)
  - Theoretical Foundations (12 subsections)
  - Basic Code Example
  - Common Pitfalls (12)
  - Advanced Application Implementation
  - How to run it
  - Reading a Transcript
  - Practical Exercises (requirements only)
  - Solutions (five-part Instructor's Analysis)
  - What this chapter established

theory_subsections:
  - "The protocol: one state, one Bell pair, two bits"
  - "The four branches, and the Pauli each one carries"
  - "The Bell basis, written out"
  - "The correction is a frame, and its signs are the subtlety"
  - "Tomography: three bases and a Bloch vector"
  - "The fidelity, and what two-thirds means"
  - "Doing the correction on the machine"
  - "Doing it in the arithmetic"
  - "The control: what the two bits are worth"
  - "What the device added to the ideal"
  - "The error bar on a fidelity"
  - "What teleportation is not"

artifacts:
  - chapters/chapter20/files/teleport/state.py
  - chapters/chapter20/files/teleport/circuit.py
  - chapters/chapter20/files/teleport/verify.py
  - chapters/chapter20/files/teleport/__init__.py
  - chapters/chapter20/files/01_protocol.py
  - chapters/chapter20/files/02_frame.py
  - chapters/chapter20/files/03_record.py
  - chapters/chapter20/files/04_fidelity.py
  - chapters/chapter20/files/05_report.py
  - chapters/chapter20/files/run_ex20.py
  - chapters/chapter20/files/exercises/ex1_bell.py
  - chapters/chapter20/files/exercises/ex2_shots.py
  - chapters/chapter20/files/exercises/ex3_correction.py
  - chapters/chapter20/files/exercises/ex4_frame.py
  - chapters/chapter20/files/exercises/memo_core.py
  - chapters/chapter20/files/exercises/memo_render.py
  - chapters/chapter20/files/exercises/ex5_report.py
  - chapters/chapter20/files/exercises/selfcheck.py
  - chapters/chapter20/files/exercises/run_exercises.py

gates:
  harness: "python3 chapters/chapter20/files/run_ex20.py"
  harness_expected: "50/50 checks passed"
  exercises: "python3 chapters/chapter20/files/exercises/run_exercises.py"
  exercises_expected: "76/76 exercise checks passed"

words: { target: 16000, floor: 14000 }

api_surface:
  state: ["Prepared", "fidelity", "distance"]
  circuit: ["BASES", "teleport", "tomography", "calibration", "before_measurement"]
  verify: ["Calibration", "Report", "bloch", "postselect", "run"]

exercises:
  - id: 1
    title: "A Bell pair that was never entangled"
    kind: repair
    files: [ex1_bell.py]
    tests: 13
    problem: "Without the Hadamard the pair is a product state; one branch still reads 0.75, which looks like a partial success."
  - id: 2
    title: "How many shots the fidelity is worth"
    kind: extend
    files: [ex2_shots.py]
    tests: 17
    problem: "A fidelity from 2,048 shots has an error of 0.011, and the correction is 0.47 away from the control."
  - id: 3
    title: "What the two classical bits are worth"
    kind: measure
    files: [ex3_correction.py]
    tests: 15
    problem: "Corrected 0.9558, postselected 0.9499, uncorrected 0.4858: the bits are worth 0.470."
  - id: 4
    title: "A Pauli frame with the bits swapped"
    kind: break
    files: [ex4_frame.py]
    tests: 14
    problem: "The swapped frame gives 0.6875 on an exact simulation, above 2/3, so a verdict-only check passes it."
  - id: 5
    title: "The memo the experiment ends on"
    kind: integrate
    files: [memo_core.py, memo_render.py, ex5_report.py]
    tests: 17
    problem: "Three fidelities, the gap, and a sentence, from a record and no clock."

multi_file_exercise:
  id: 5
  files: [memo_core.py, memo_render.py, ex5_report.py]
  why: >
    memo_core.py is pure (a record in, a dictionary out), memo_render.py formats,
    ex5_report.py knows where the record lives.

figures:
  - "the protocol: three qubits and two classical bits"
  - "the four branches and their corrections"
  - "the three fidelities on the device"
  - "the frame: which bit flips which basis"
  - "the record of the last run"

runs:
  - "runs/chapter20/0042-teleport-pi3-pi4-2048-ibm/result.json (13 circuits, 2,048 shots, depth 18)"

chapter_notes: >
  The device run is the chapter's evidence: dynamic 0.9558, postselect 0.9499,
  uncorrected 0.4858 on ibm_kingston. The uncorrected run is not a failure to hide;
  it is the control that gives the two classical bits their value.
