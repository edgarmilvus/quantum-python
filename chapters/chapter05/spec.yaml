book: "Quantum Python"
chapter: 5
title: "Shots, Statistics, Error Bars"
subtitle: "From a frequency to a claim, and from a biased estimate to an honest one"

invariant: >
  A frequency is an estimate with an interval; readout calibration measures the bias the
  interval cannot see, and correcting with it takes the recorded CHSH value from 2.541 to
  2.780 while widening the error bar by about 10%.

audience:
  reader: "Senior software engineer. Finished chapters 1 to 4. No physics, no statistics."
  assumes:
    - "counts and sampling (chapter 1)"
    - "expectations and their errors (chapter 4)"
  does_not_assume: ["hypothesis testing", "bootstrap theory", "density matrices"]

structure:
  - Opening (3 paragraphs, no headings)
  - Theoretical Foundations (10 subsections)
  - Basic Code Example
  - Common Pitfalls (10-12)
  - Advanced Application Implementation
  - How to run it
  - Reading a Transcript
  - Practical Exercises (requirements only)
  - Solutions (five-part Instructor's Analysis)
  - What this chapter established

theory_subsections:
  - "The task: one frequency, one interval, one correction"
  - "The standard error is one line, and it is not the whole story"
  - "Wilson, and why the textbook interval fails at the edges"
  - "A shot budget, and what four tests at once cost"
  - "Readout is a matrix, and a matrix can be inverted"
  - "Inverting removes bias and adds variance, and both are measurable"
  - "Clipping: when the correction says negative probability"
  - "What an error bar does not cover"
  - "Decision table: report, correct, or re-run"
  - "A worked derivation: the readout arithmetic by hand"

artifacts:
  - chapters/chapter05/files/stats.py
  - chapters/chapter05/files/calibrate.py
  - chapters/chapter05/files/01_sampling.py
  - chapters/chapter05/files/02_intervals.py
  - chapters/chapter05/files/03_budget.py
  - chapters/chapter05/files/04_readout.py
  - chapters/chapter05/files/05_bias.py
  - chapters/chapter05/files/06_second_domain.py
  - chapters/chapter05/files/run_ex5.py
  - chapters/chapter05/files/exercises/ex1_edges.py
  - chapters/chapter05/files/exercises/ex2_coverage.py
  - chapters/chapter05/files/exercises/ex3_per_qubit.py
  - chapters/chapter05/files/exercises/ex4_breakeven.py
  - chapters/chapter05/files/exercises/report_core.py
  - chapters/chapter05/files/exercises/report_render.py
  - chapters/chapter05/files/exercises/ex5_report.py
  - chapters/chapter05/files/exercises/selfcheck.py
  - chapters/chapter05/files/exercises/run_exercises.py

gates:
  harness: "python3 chapters/chapter05/files/run_ex5.py"
  harness_expected: "52/52 checks passed"
  exercises: "python3 chapters/chapter05/files/exercises/run_exercises.py"
  exercises_expected: "48/48 exercise checks passed"

words: { target: 17000, floor: 14000 }

api_surface:
  stats.py: ["wilson", "standard_error", "shots_for", "bonferroni", "z_score",
             "combine_independent", "confusion", "invert", "correct", "clip_and_renormalize"]
  calibrate.py: ["load", "matrix", "invert", "corrected_chsh", "chsh_from", "diagonal_error"]

exercises:
  - id: 1
    title: "Intervals that leave the unit interval"
    kind: repair
    files: [ex1_edges.py]
    tests: 9
    problem: "A dashboard reports p plus or minus 1.96 root p(1-p)/n and prints negative conversion at the edges."
  - id: 2
    title: "Measure the coverage, do not trust the formula"
    kind: extend
    files: [ex2_coverage.py]
    tests: 10
    problem: "A 95% interval should contain the truth 95% of the time, at every sample size."
  - id: 3
    title: "The readout error, per qubit"
    kind: measure
    files: [ex3_per_qubit.py]
    tests: 10
    problem: "A budget needs two numbers, not a 4x4 matrix, and the keys are in Qiskit's order."
  - id: 4
    title: "Where correcting costs more than it fixes"
    kind: break
    files: [ex4_breakeven.py]
    tests: 10
    problem: "Correction trades bias for variance; the trade stops paying at some readout error."
  - id: 5
    title: "A readout report that separates data from rendering"
    kind: integrate
    files: [report_core.py, report_render.py, ex5_report.py]
    tests: 13
    problem: "Calibration and data must become one verdict, testable without either file."

multi_file_exercise:
  id: 5
  files: [report_core.py, report_render.py, ex5_report.py]
  why: >
    report_core.py is pure (dictionaries to a summary), report_render.py formats,
    ex5_report.py reads the two recorded files and prints.

figures:
  - "a frequency with its interval at four sample sizes"
  - "the Wilson interval against the normal one at the edges"
  - "the readout matrix as a grid, with the diagonal highlighted"
  - "S before and after correction, against the two bounds"

chapter_notes: >
  The calibration is runs/0009-ibm-readout, four preparations at 4096 shots. The data
  corrected is runs/0007-ibm-chsh. Both are recorded once and never re-run.
