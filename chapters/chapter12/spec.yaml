book: "Quantum Python"
chapter: 12
title: "Noise and Error Mitigation"
subtitle: "Three channels, one fitted rate, and the limits of extrapolation"

invariant: >
  A device's noise is not one number: readout, gate and dephasing errors have
  different signatures and different fixes, and only a per-gate model predicts
  a circuit it was not fitted on.

audience:
  reader: "Senior software engineer. Finished chapters 1 to 11. Comfortable with a density matrix after chapter 2."
  assumes:
    - "density matrices and measurement (chapters 2 and 4)"
    - "the readout matrix and its inverse (chapter 5)"
    - "recorded runs and the replay backend (chapters 4 to 11)"
  does_not_assume: ["T1 and T2 physics", "Kraus formalism", "zero-noise extrapolation"]

structure:
  - Opening (3 paragraphs, no headings)
  - Theoretical Foundations (11 subsections)
  - Basic Code Example
  - Common Pitfalls (12)
  - Advanced Application Implementation
  - How to run it
  - Reading a Transcript
  - Practical Exercises (requirements only)
  - Solutions (five-part Instructor's Analysis)
  - What this chapter established

theory_subsections:
  - "The task: explain three shortfalls with one model"
  - "A channel is a list of operators, and the list is short"
  - "The three channels a superconducting device produces"
  - "One word, three conventions: what `p` means in a depolarizing channel"
  - "Readout is a matrix, and the matrix is asymmetric"
  - "A gate rate is a property of an edge, not of a device"
  - "The survival budget: multiplying (1 - e) is a model, not a law"
  - "Zero-noise extrapolation, and why the order of the two steps matters"
  - "The error bar grows, and that is the price"
  - "What a mitigation report owes the reader"
  - "Decision table: correct, extrapolate, or report the raw number"

artifacts:
  - chapters/chapter12/files/noise/states.py
  - chapters/chapter12/files/noise/channels.py
  - chapters/chapter12/files/noise/device.py
  - chapters/chapter12/files/noise/confusion.py
  - chapters/chapter12/files/noise/simulate.py
  - chapters/chapter12/files/noise/zne.py
  - chapters/chapter12/files/noise/fit.py
  - chapters/chapter12/files/noise/__init__.py
  - chapters/chapter12/files/01_channels.py
  - chapters/chapter12/files/02_simulate.py
  - chapters/chapter12/files/03_readout.py
  - chapters/chapter12/files/04_zne.py
  - chapters/chapter12/files/05_leverage.py
  - chapters/chapter12/files/run_ex12.py
  - chapters/chapter12/files/exercises/ex1_clip.py
  - chapters/chapter12/files/exercises/ex2_damping.py
  - chapters/chapter12/files/exercises/ex3_leverage.py
  - chapters/chapter12/files/exercises/ex4_transpose.py
  - chapters/chapter12/files/exercises/plan_core.py
  - chapters/chapter12/files/exercises/plan_render.py
  - chapters/chapter12/files/exercises/ex5_mitigation.py
  - chapters/chapter12/files/exercises/selfcheck.py
  - chapters/chapter12/files/exercises/run_exercises.py

gates:
  harness: "python3 chapters/chapter12/files/run_ex12.py"
  harness_expected: "95/95 checks passed"
  exercises: "python3 chapters/chapter12/files/exercises/run_exercises.py"
  exercises_expected: "85/85 exercise checks passed"

words: { target: 22000, floor: 14000 }

api_surface:
  states: ["zero", "ket", "apply", "probabilities", "purity", "coherence", "bloch", "labels", "fidelity_to", "trace_distance"]
  channels: ["depolarizing", "amplitude_damping", "phase_damping", "apply_channel", "check_complete", "relaxation_channels"]
  device: ["Readout", "Rates", "Budget", "readout_from_record", "estimate_flips", "asymmetry", "calibration_budget", "sigma_binomial"]
  confusion: ["matrix_from_record", "tensor", "independence_error", "correct", "amplification", "correlation", "chsh", "chsh_sigma"]
  simulate: ["Simulator", "bell", "chsh_setting"]
  zne: ["fold", "Point", "linear", "exponential"]
  fit: ["uniform_rate", "predict", "peak", "Test", "test", "residuals"]

exercises:
  - id: 1
    title: "A correction that clips by throwing mass away"
    kind: repair
    files: [ex1_clip.py]
    tests: 12
    problem: "Zeroing the negative entries without renormalising leaves a distribution that sums to 1.025, so every frequency is inflated."
  - id: 2
    title: "A second channel, and the relation it breaks"
    kind: extend
    files: [ex2_damping.py]
    tests: 24
    problem: "Amplitude damping leaves a Bell correlation of 0.99 and a fidelity of 0.5; the depolarising relation infers 0.9925."
  - id: 3
    title: "How many gates before an average stops working"
    kind: measure
    files: [ex3_leverage.py]
    tests: 22
    problem: "The average rate and the per-gate table disagree by one point on one gate and by a third on forty-five, and they part at five."
  - id: 4
    title: "The transpose that looks right"
    kind: break
    files: [ex4_transpose.py]
    tests: 14
    problem: "Applying M-inverse on the wrong side is exact for symmetric readout and wrong by 1.1% on this device."
  - id: 5
    title: "One report from three stages of mitigation"
    kind: integrate
    files: [plan_core.py, plan_render.py, ex5_mitigation.py]
    tests: 13
    problem: "Raw 2.541, corrected 2.7815, extrapolated 2.81: the report must carry all three and the error bar."

multi_file_exercise:
  id: 5
  files: [plan_core.py, plan_render.py, ex5_mitigation.py]
  why: >
    plan_core.py is pure (histograms, matrix and points in; a summary out), plan_render.py formats,
    ex5_mitigation.py is the only file that reads a run and builds a simulator.

figures:
  - "three channels, three signatures on the Bloch vector"
  - "the noise stack: gate, channel, readout, shots"
  - "two survival curves: the average rate and the per-gate table"
  - "zero-noise extrapolation with the two pipelines"
  - "the mitigation pipeline and what each stage closes"

runs:
  - "runs/chapter12/0020-calibration-snapshot/circuit.json (exported by tools/export_calibration.py)"
  - "runs/0021-chapter12-local/{gate.txt,output.txt}"

chapter_notes: >
  Every number about ibm_fez comes from runs/0009 (readout), 0001 (Bell), 0007 (CHSH), 0013
  (Grover) or 0020 (the provider's saved per-gate calibration, exported once). The ZNE
  numbers are the model's, calibrated on the corrected CHSH value, and the prose says so.
