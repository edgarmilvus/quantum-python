book: "Quantum Python"
chapter: 10
title: "VQE for the Hydrogen Molecule"
subtitle: "One knob, two tallies, and twenty millihartree of correlation"

invariant: >
  A one-parameter ansatz reaches the exact ground state of H2 at equilibrium, the twenty
  millihartree of correlation energy only appears when the exchange term is measured, and the
  recorded device returns an energy 87 mHa above exact — thirty-five times its own shot noise.

audience:
  reader: "Senior software engineer. Finished chapters 1 to 9. No chemistry, no optimisation theory."
  assumes:
    - "Hadamards, rotations, measurement bases (chapters 2 and 8)"
    - "shot noise and intervals (chapter 5)"
    - "readout calibration and its limits (chapter 5)"
  does_not_assume: ["molecular integrals", "second quantisation", "gradient formulas"]

structure:
  - Opening (3 paragraphs, no headings)
  - Theoretical Foundations (10 subsections)
  - Basic Code Example
  - Common Pitfalls (10-12)
  - Advanced Application Implementation
  - How to run it
  - Reading a Transcript
  - Practical Exercises (requirements only)
  - Solutions (five-part Instructor's Analysis)
  - What this chapter established

theory_subsections:
  - "The task: one energy, one molecule, a floor you cannot cross"
  - "The Hamiltonian is a list of weighted measurements"
  - "Two qubits, five terms, and where the numbers come from"
  - "The Hartree-Fock string is the starting point, not the answer"
  - "One knob moves the state along a circle the Hamiltonian can see"
  - "Two tallies, because one basis cannot see the exchange term"
  - "The variance is not the sum of the variances"
  - "Chemical accuracy, and the shot count it costs"
  - "What the device did to an 87 mHa gap"
  - "Decision table: VQE, exact diagonalisation, or neither"
  - "A worked derivation: the one-knob energy by hand"

artifacts:
  - chapters/chapter10/files/h2.py
  - chapters/chapter10/files/vqe.py
  - chapters/chapter10/files/01_hamiltonian.py
  - chapters/chapter10/files/02_ansatz.py
  - chapters/chapter10/files/03_optimise.py
  - chapters/chapter10/files/04_shots.py
  - chapters/chapter10/files/05_hardware.py
  - chapters/chapter10/files/06_one_qubit.py
  - chapters/chapter10/files/run_ex10.py
  - chapters/chapter10/files/exercises/ex1_one_basis.py
  - chapters/chapter10/files/exercises/ex2_two_knobs.py
  - chapters/chapter10/files/exercises/ex3_variance.py
  - chapters/chapter10/files/exercises/ex4_below_floor.py
  - chapters/chapter10/files/exercises/plan_core.py
  - chapters/chapter10/files/exercises/plan_render.py
  - chapters/chapter10/files/exercises/ex5_plan.py
  - chapters/chapter10/files/exercises/selfcheck.py
  - chapters/chapter10/files/exercises/run_exercises.py

gates:
  harness: "python3 chapters/chapter10/files/run_ex10.py"
  harness_expected: "50/50 checks passed"
  exercises: "python3 chapters/chapter10/files/exercises/run_exercises.py"
  exercises_expected: "56/56 exercise checks passed"

words: { target: 17000, floor: 14000 }

api_surface:
  h2.py: ["TERMS", "NUCLEAR", "CHEMICAL_ACCURACY", "operator", "hamiltonian",
          "total_with_nuclear", "exact_energies", "exact_ground", "ansatz_state",
          "energy", "best_angle", "analytic_minimum", "hartree_to_kcal"]
  vqe.py: ["golden_section", "tally", "average", "energy_from_tallies", "shot_sigma", "shots_for"]

exercises:
  - id: 1
    title: "The energy computed from one tally"
    kind: repair
    files: [ex1_one_basis.py]
    tests: 8
    problem: "Measuring only Z loses the exchange term and lands 19.6 mHa above Hartree-Fock."
  - id: 2
    title: "A second knob, and whether it buys anything"
    kind: extend
    files: [ex2_two_knobs.py]
    tests: 9
    problem: "Two rotations reach the same ground state as one; the extra knob is redundant here."
  - id: 3
    title: "Which term costs the most shots"
    kind: measure
    files: [ex3_variance.py]
    tests: 11
    problem: "The variance is not the sum of per-term variances: 7.89 mHa against 6.83."
  - id: 4
    title: "The variational principle does not apply to estimates"
    kind: break
    files: [ex4_below_floor.py]
    tests: 14
    problem: "Half of all measured energies land below the exact ground state, at every shot count."
  - id: 5
    title: "An energy report that separates the estimate from the verdict"
    kind: integrate
    files: [plan_core.py, plan_render.py, ex5_plan.py]
    tests: 14
    problem: "Angle, shots, energy, sigma and the accuracy verdict must come out of one computation."

multi_file_exercise:
  id: 5
  files: [plan_core.py, plan_render.py, ex5_plan.py]
  why: >
    plan_core.py is pure (angle and shots in, a dictionary out), plan_render.py formats,
    ex5_plan.py chooses the cases and prints.

figures:
  - "the five terms and the two bases they need"
  - "the energy against the knob, with Hartree-Fock and exact marked"
  - "sigma against shots, with chemical accuracy as a line"
  - "the device's energy against exact, Hartree-Fock and the noise band"

chapter_notes: >
  The device run is runs/chapter10/0017-vqe-h2-10000-ibm: two tallies at theta -0.2235, 10,000 shots each,
  depth 9. The coefficients are Qollab's table, which reproduces the PySCF and
  qiskit-nature rows; the exact energies were re-derived from them in this chapter's code.
