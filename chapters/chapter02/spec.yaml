book: "Quantum Python"
chapter: 2
title: "Two Qubits, and the Order That Bites"
subtitle: "Tensor products, phase, the Bloch sphere, and the endianness convention"

invariant: >
  Two qubits are four complex amplitudes written as a tensor product, the order
  of the factors is a convention rather than a fact, and a program that assumes
  the wrong order prints the mirror image of the correct result.

audience:
  reader: "Senior software engineer. Finished chapter 1. No physics."
  assumes:
    - "state as a complex array, normalization, measurement as sampling (chapter 1)"
    - "numpy reshape and kron"
  does_not_assume: ["Hilbert spaces", "Dirac notation", "rotations as physics"]

structure:
  - Opening (3 paragraphs, no headings)
  - Theoretical Foundations (10 subsections, 400-700 words each)
  - Basic Code Example
  - Common Pitfalls (10-12)
  - Advanced Application Implementation
  - How to run it
  - Reading a Transcript
  - Practical Exercises (requirements only)
  - Solutions (five-part Instructor's Analysis)
  - What this chapter established

theory_subsections:
  - "The task: one register, two wires, four amplitudes"
  - "The tensor product is a data layout, not a mystery"
  - "Applying a gate to one wire is a kron with the identity"
  - "Phase is the thing you can rotate, and interference is how you see it"
  - "The Bloch vector is three expectation values"
  - "Why the order of the factors is a convention"
  - "Qiskit is little-endian, Cirq indexes in the order you pass"
  - "A Bell pair is the state that does not factor"
  - "The cost, again: four amplitudes become sixteen"
  - "Decision table: tensor by hand, kron, or let the SDK do it"

artifacts:
  - chapters/chapter02/files/register.py
  - chapters/chapter02/files/gates.py
  - chapters/chapter02/files/ordering.py
  - chapters/chapter02/files/01_tensor.py
  - chapters/chapter02/files/02_wire.py
  - chapters/chapter02/files/03_phase.py
  - chapters/chapter02/files/04_bloch.py
  - chapters/chapter02/files/05_ordering.py
  - chapters/chapter02/files/run_ex2.py
  - chapters/chapter02/files/exercises/ex1_order.py
  - chapters/chapter02/files/exercises/ex2_wire.py
  - chapters/chapter02/files/exercises/ex3_tomography.py
  - chapters/chapter02/files/exercises/ex4_angle_shots.py
  - chapters/chapter02/files/exercises/pipeline_core.py
  - chapters/chapter02/files/exercises/pipeline_render.py
  - chapters/chapter02/files/exercises/ex5_pipeline.py
  - chapters/chapter02/files/exercises/run_exercises.py
  - chapters/chapter02/files/exercises/selfcheck.py

gates:
  harness: "python3 chapters/chapter02/files/run_ex2.py"
  harness_expected: "NN/NN checks passed"
  exercises: "python3 chapters/chapter02/files/exercises/run_exercises.py"
  exercises_expected: "NN/NN exercise checks passed"

words: { target: 17000, floor: 14000 }

api_surface:
  register.py: ["Register", "Register.from_amplitudes", "Register.tensor", "Register.probabilities",
                "Register.labels", "Register.apply", "Register.norm", "Register.bitstring"]
  gates.py: ["I2", "X", "Y", "Z", "H", "S", "T", "Rx", "Ry", "Rz", "apply_one"]
  ordering.py: ["bell_numpy", "bell_qiskit", "bell_cirq", "x_on_wire0_numpy",
                "x_on_wire0_qiskit", "x_on_wire0_cirq", "cirq_big_endian_note"]

exercises:
  - id: 1
    title: "The tensor product that came out backwards"
    kind: repair
    files: [ex1_order.py]
    tests: 8
    problem: "A loader builds |q1 q0> but the sampler labels it |q0 q1>, so every outcome is mirrored."
  - id: 2
    title: "A gate on the second wire only"
    kind: extend
    files: [ex2_wire.py]
    tests: 9
    problem: "A controlled experiment needs X on wire 1 and nothing on wire 0, and the naive kron order swaps it."
  - id: 3
    title: "The Bloch vector you can actually measure"
    kind: measure
    files: [ex3_tomography.py]
    tests: 10
    problem: "A report claims a qubit is at 45 degrees; the only data is counts from three basis rotations."
  - id: 4
    title: "How many shots for a five-degree angle"
    kind: break
    files: [ex4_angle_shots.py]
    tests: 9
    problem: "The dashboard wants the Bloch angle to 5 degrees; nobody knows whether that is 100 shots or 100,000."
  - id: 5
    title: "A pipeline that separates gates from execution"
    kind: integrate
    files: [pipeline_core.py, pipeline_render.py, ex5_pipeline.py]
    tests: 12
    problem: "The same circuit must run on the hand-written simulator and on two SDKs, with one report shape."

multi_file_exercise:
  id: 5
  files: [pipeline_core.py, pipeline_render.py, ex5_pipeline.py]
  why: >
    pipeline_core.py is pure: a gate list plus a wire becomes a matrix, and a matrix
    plus a state becomes a state. pipeline_render.py turns a final state into rows.
    ex5_pipeline.py is the wiring that picks a backend. The seam is the gate list, so
    the matrix arithmetic is testable without any SDK and the SDK adapters are
    testable without printing.

figures:
  - "two qubits as four amplitudes, with the tensor product drawn as a grid"
  - "a gate on wire 1 as kron(I, U), and the same gate on wire 0 as kron(U, I)"
  - "the Bloch sphere reduced to three measured axes, with the tomography circuits"
  - "the endianness collision: the same prepared state as Qiskit and Cirq index it"
  - "the file graph for this chapter"

chapter_notes: >
  The reader has never seen a tensor product. The chapter introduces it as a nested
  loop over two arrays, then shows numpy.kron, then shows that the two orders are
  both valid and give different labels. Every claim about convention is a printed
  array, not a warning. No hardware run is required; the endianness defect is a
  simulator defect and is reproduced identically on three simulators.
