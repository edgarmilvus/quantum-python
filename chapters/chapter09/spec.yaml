book: "Quantum Python"
chapter: 9
title: "Order Finding and Shor-lite"
subtitle: "Factoring as a phase, and the resource count that keeps it honest"

invariant: >
  Factoring reduces to finding the order of a modulo N, the order is an eigenphase of the
  multiplier, and phase estimation recovers it: fifteen factors with a 0.5 chance per run,
  and the same textbook circuit for a 2048-bit modulus needs 36 qubits and a tebibyte of
  state that no simulator can hold.

audience:
  reader: "Senior software engineer. Finished chapters 1 to 8. No physics, no number theory."
  assumes:
    - "phase estimation and the transform (chapter 8)"
    - "intervals and success probabilities (chapters 5 and 7)"
  does_not_assume: ["group theory", "continued fraction theory", "error correction"]

structure:
  - Opening (3 paragraphs, no headings)
  - Theoretical Foundations (10 subsections)
  - Basic Code Example
  - Common Pitfalls (10-12)
  - Advanced Application Implementation
  - How to run it
  - Reading a Transcript
  - Practical Exercises (requirements only)
  - Solutions (five-part Instructor's Analysis)
  - What this chapter established

theory_subsections:
  - "The task: a modulus, a base, and the factors"
  - "The order is the length of a cycle"
  - "The multiplier is a permutation, and its eigenphases are the order"
  - "Continued fractions turn a phase into a denominator"
  - "Two gcds, and the three ways they fail"
  - "The success rate is phi(r)/r, and it does not improve with width"
  - "What fifteen costs, and what 2048 costs"
  - "Why the textbook count is not the machine count"
  - "What Shor does not do"
  - "Decision table: factor, estimate, or give up"
  - "A worked derivation: seven modulo fifteen in four bits"

artifacts:
  - chapters/chapter09/files/order.py
  - chapters/chapter09/files/01_order.py
  - chapters/chapter09/files/02_permutation.py
  - chapters/chapter09/files/03_shor.py
  - chapters/chapter09/files/04_resources.py
  - chapters/chapter09/files/05_classical.py
  - chapters/chapter09/files/run_ex9.py
  - chapters/chapter09/files/exercises/ex1_guards.py
  - chapters/chapter09/files/exercises/ex2_noise.py
  - chapters/chapter09/files/exercises/ex3_width.py
  - chapters/chapter09/files/exercises/ex4_wall.py
  - chapters/chapter09/files/exercises/plan_core.py
  - chapters/chapter09/files/exercises/plan_render.py
  - chapters/chapter09/files/exercises/ex5_plan.py
  - chapters/chapter09/files/exercises/selfcheck.py
  - chapters/chapter09/files/exercises/run_exercises.py

gates:
  harness: "python3 chapters/chapter09/files/run_ex9.py"
  harness_expected: "44/44 checks passed"
  exercises: "python3 chapters/chapter09/files/exercises/run_exercises.py"
  exercises_expected: "130/130 exercise checks passed"

words: { target: 17000, floor: 14000 }

api_surface:
  order.py: ["order_of", "continued_fraction", "factors_from_order", "shor", "best_effort",
             "multiplier_matrix", "power_matrix", "order_finding", "recover_order",
             "attempt", "quantum_success", "circuit_resources"]

exercises:
  - id: 1
    title: "A factor function that skips the two guards"
    kind: repair
    files: [ex1_guards.py]
    tests: 9
    problem: "Without the r-even and half-not-1 checks, the gcds report 1 and N as a factorisation."
  - id: 2
    title: "Continued fractions with a noisy phase"
    kind: extend
    files: [ex2_noise.py]
    tests: 70
    problem: "The recoverable band around the true k is one unit wide at six ancillas and wider at ten."
  - id: 3
    title: "How many ancillas a reliable run needs"
    kind: measure
    files: [ex3_width.py]
    tests: 11
    problem: "The rate climbs with width and stops at phi(r)/r, which for order six is one third."
  - id: 4
    title: "The size at which the chapter's own simulator dies"
    kind: break
    files: [ex4_wall.py]
    tests: 12
    problem: "A 2048-bit modulus needs 36 qubits and a tebibyte of state."
  - id: 5
    title: "A factoring plan that separates arithmetic from reporting"
    kind: integrate
    files: [plan_core.py, plan_render.py, ex5_plan.py]
    tests: 14
    problem: "Order, width, success rate and factors must come out of one computation."

multi_file_exercise:
  id: 5
  files: [plan_core.py, plan_render.py, ex5_plan.py]
  why: >
    plan_core.py is pure (modulus and base in, plan out), plan_render.py formats, ex5_plan.py
    picks the cases and prints.

figures:
  - "the orbit of seven modulo fifteen"
  - "the pipeline: phase estimation, continued fractions, two gcds"
  - "qubits against modulus, textbook and estimated"
  - "the file graph"

chapter_notes: >
  No device run: the circuit needs 3 bits per bit of modulus and the chapter's own simulator
  stops at twenty qubits. The RSA-2048 figures are published estimates, quoted as estimates.
