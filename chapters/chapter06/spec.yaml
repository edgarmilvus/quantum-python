book: "Quantum Python"
chapter: 6
title: "Oracles: Deutsch-Jozsa and Bernstein-Vazirani"
subtitle: "A function as a permutation, and one query where the classical program needs n"

invariant: >
  An oracle is a permutation of the amplitude vector, and one query to it decides a global
  property of a function: Deutsch-Jozsa separates constant from balanced in one query where
  a classical program needs 2^(n-1)+1, and Bernstein-Vazirani returns an n-bit secret in one
  query where a classical program needs n.

audience:
  reader: "Senior software engineer. Finished chapters 1 to 5. No physics."
  assumes:
    - "Hadamard, tensor product, measurement (chapters 2 and 3)"
    - "counts and intervals (chapters 4 and 5)"
  does_not_assume: ["query complexity theory", "promise problems", "circuit synthesis"]

structure:
  - Opening (3 paragraphs, no headings)
  - Theoretical Foundations (10 subsections)
  - Basic Code Example
  - Common Pitfalls (10-12)
  - Advanced Application Implementation
  - How to run it
  - Reading a Transcript
  - Practical Exercises (requirements only)
  - Solutions (five-part Instructor's Analysis)
  - What this chapter established

theory_subsections:
  - "The task: a function you cannot read, only call"
  - "An oracle is a permutation of the amplitude vector"
  - "Phase kickback: the output qubit writes a sign"
  - "Deutsch-Jozsa in one query, and why interference reads a global property"
  - "Bernstein-Vazirani: the secret is the frequency of the sign pattern"
  - "What one query buys, and what it does not"
  - "The promise is the algorithm's licence"
  - "The cost of writing an oracle as a matrix"
  - "Decision table: simulate the oracle or let the SDK build it"
  - "A worked derivation: two bits, four amplitudes, one sign pattern"

artifacts:
  - chapters/chapter06/files/oracle.py
  - chapters/chapter06/files/algorithms.py
  - chapters/chapter06/files/01_oracle.py
  - chapters/chapter06/files/02_phase.py
  - chapters/chapter06/files/03_dj.py
  - chapters/chapter06/files/04_bv.py
  - chapters/chapter06/files/05_hardware.py
  - chapters/chapter06/files/06_promise.py
  - chapters/chapter06/files/run_ex6.py
  - chapters/chapter06/files/exercises/ex1_oracle.py
  - chapters/chapter06/files/exercises/ex2_cnots.py
  - chapters/chapter06/files/exercises/ex3_confidence.py
  - chapters/chapter06/files/exercises/ex4_size.py
  - chapters/chapter06/files/exercises/pipeline_core.py
  - chapters/chapter06/files/exercises/pipeline_render.py
  - chapters/chapter06/files/exercises/ex5_pipeline.py
  - chapters/chapter06/files/exercises/selfcheck.py
  - chapters/chapter06/files/exercises/run_exercises.py

gates:
  harness: "python3 chapters/chapter06/files/run_ex6.py"
  harness_expected: "131/131 checks passed"
  exercises: "python3 chapters/chapter06/files/exercises/run_exercises.py"
  exercises_expected: "75/75 exercise checks passed"

words: { target: 17000, floor: 14000 }

api_surface:
  oracle.py: ["permutation", "index", "bits", "constant", "balanced", "linear",
              "is_constant", "is_balanced", "distribution"]
  algorithms.py: ["deutsch_jozsa", "bernstein_vazirani", "deutsch_jozsa_answer",
                  "classical_queries_deutsch_jozsa", "classical_queries_bernstein_vazirani",
                  "query_counts", "amplitude_pattern", "most_likely"]

exercises:
  - id: 1
    title: "An oracle that flips the input instead of the output"
    kind: repair
    files: [ex1_oracle.py]
    tests: 8
    problem: "Two lines swapped in the permutation builder; the algorithm still returns a peak and is wrong."
  - id: 2
    title: "The same oracle built from CNOTs"
    kind: extend
    files: [ex2_cnots.py]
    tests: 29
    problem: "On hardware an oracle is a circuit of CNOTs, not a matrix; the two must agree."
  - id: 3
    title: "What the device's answer is worth"
    kind: measure
    files: [ex3_confidence.py]
    tests: 10
    problem: "The secret came back 965 times in 1024; that is an estimate with an interval."
  - id: 4
    title: "The size at which the matrix stops fitting"
    kind: break
    files: [ex4_size.py]
    tests: 13
    problem: "An oracle as a dense matrix is 16 KiB at four bits and 64 GiB at fifteen."
  - id: 5
    title: "A query report that separates counts from rendering"
    kind: integrate
    files: [pipeline_core.py, pipeline_render.py, ex5_pipeline.py]
    tests: 15
    problem: "The classical and quantum query counts must come out of one computation and one renderer."

multi_file_exercise:
  id: 5
  files: [pipeline_core.py, pipeline_render.py, ex5_pipeline.py]
  why: >
    pipeline_core.py is pure (a function in, a report dictionary out), pipeline_render.py
    formats, ex5_pipeline.py chooses the functions and prints.

figures:
  - "an oracle as a permutation of eight amplitudes"
  - "phase kickback: the sign pattern the oracle writes"
  - "the four Hadamard stages of Deutsch-Jozsa"
  - "query counts, classical against quantum, for the two problems"

chapter_notes: >
  The device run is runs/chapter06/0011-bv-1011-1024-ibm: one circuit, 1024 shots, ibm_marrakesh, secret 101.
  The first submission of that circuit returned zeros because the X on the output qubit was
  missing; the record kept is the corrected one.
