book: "Quantum Python"
chapter: 8
title: "The Quantum Fourier Transform and Phase Estimation"
subtitle: "A phase turned into a bit string, to a precision you choose"

invariant: >
  The Fourier transform is Hadamards and controlled phases, and phase estimation uses its
  inverse to read an eigenphase into n bits: exact phases come back with probability 1.0,
  and any phase comes back as the nearest n-bit value with probability at least 4/pi^2.

audience:
  reader: "Senior software engineer. Finished chapters 1 to 7. No physics."
  assumes:
    - "Hadamards, controlled gates, depth (chapters 2 and 3)"
    - "the rotation picture from Grover (chapter 7)"
  does_not_assume: ["signal processing", "Kitaev's bound proof", "Shor's algorithm"]

structure:
  - Opening (3 paragraphs, no headings)
  - Theoretical Foundations (10 subsections)
  - Basic Code Example
  - Common Pitfalls (10-12)
  - Advanced Application Implementation
  - How to run it
  - Reading a Transcript
  - Practical Exercises (requirements only)
  - Solutions (five-part Instructor's Analysis)
  - What this chapter established

theory_subsections:
  - "The task: read a phase into bits"
  - "The transform is a matrix of roots of unity"
  - "The circuit is Hadamards and controlled phases, plus swaps"
  - "Why the swaps are there, and why they are an artefact"
  - "Phase estimation: write the phase, then invert the transform"
  - "Exact phases are certain, and inexact ones are not"
  - "The 4/pi^2 floor, and what it means for planning"
  - "Bits, runs, and the cost of confidence"
  - "The QFT is not a faster FFT"
  - "Decision table: transform, estimate, or simulate"
  - "A worked derivation: one eighth at three bits"

artifacts:
  - chapters/chapter08/files/qft.py
  - chapters/chapter08/files/phase.py
  - chapters/chapter08/files/01_dft.py
  - chapters/chapter08/files/02_circuit.py
  - chapters/chapter08/files/03_pea.py
  - chapters/chapter08/files/04_precision.py
  - chapters/chapter08/files/05_classical.py
  - chapters/chapter08/files/run_ex8.py
  - chapters/chapter08/files/exercises/ex1_sign.py
  - chapters/chapter08/files/exercises/ex2_periodic.py
  - chapters/chapter08/files/exercises/ex3_repeats.py
  - chapters/chapter08/files/exercises/ex4_size.py
  - chapters/chapter08/files/exercises/plan_core.py
  - chapters/chapter08/files/exercises/plan_render.py
  - chapters/chapter08/files/exercises/ex5_plan.py
  - chapters/chapter08/files/exercises/selfcheck.py
  - chapters/chapter08/files/exercises/run_exercises.py

gates:
  harness: "python3 chapters/chapter08/files/run_ex8.py"
  harness_expected: "80/80 checks passed"
  exercises: "python3 chapters/chapter08/files/exercises/run_exercises.py"
  exercises_expected: "65/65 exercise checks passed"

words: { target: 17000, floor: 14000 }

api_surface:
  qft.py: ["dft", "qft_matrix", "inverse_qft_matrix", "qft_schedule", "gate_count",
           "circuit_depth", "controlled_phase", "swap"]
  phase.py: ["unitary", "prepare", "pea_state", "distribution", "estimate",
             "phase_of", "success_probability", "precision", "controlled_power"]

exercises:
  - id: 1
    title: "The inverse transform with the wrong sign"
    kind: repair
    files: [ex1_sign.py]
    tests: 10
    problem: "Applying the forward DFT where the inverse belongs mirrors the answer: 1/8 comes back as 7/8."
  - id: 2
    title: "The transform of a periodic state"
    kind: extend
    files: [ex2_periodic.py]
    tests: 9
    problem: "Periodic input, concentrated output; the exercise fixes the direction of the duality."
  - id: 3
    title: "How many repetitions make the estimate reliable"
    kind: measure
    files: [ex3_repeats.py]
    tests: 9
    problem: "A 68% single-shot probability needs nineteen runs for 95% confidence."
  - id: 4
    title: "The size at which the transform stops fitting"
    kind: break
    files: [ex4_size.py]
    tests: 12
    problem: "The dense matrix is 16 GiB at fifteen qubits and the circuit is 120 gates."
  - id: 5
    title: "An estimation plan that separates bits from reporting"
    kind: integrate
    files: [plan_core.py, plan_render.py, ex5_plan.py]
    tests: 14
    problem: "A target precision, a run count and a gate budget must come out of one computation."

multi_file_exercise:
  id: 5
  files: [plan_core.py, plan_render.py, ex5_plan.py]
  why: >
    plan_core.py is pure (precision in, plan out), plan_render.py formats, ex5_plan.py picks
    the cases and prints.

figures:
  - "the QFT circuit: Hadamards with controlled phases, then swaps"
  - "phase estimation: ancillas, controlled powers, inverse transform"
  - "success probability against bits, with the 4/pi^2 floor"
  - "the file graph"

chapter_notes: >
  No device run in this chapter: phase estimation needs n+1 qubits and a controlled
  power per ancilla, and chapter 7 measured what depth does to a 3-qubit circuit. The
  chapter says so instead of spending a job on a histogram nobody would quote.
