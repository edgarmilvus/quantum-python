book: "Quantum Python"
chapter: 7
title: "Grover and Amplitude Amplification"
subtitle: "A search that costs sqrt(N) queries, and the iteration count that ruins it"

invariant: >
  Grover's search raises the marked amplitude by a rotation of 2 theta per iteration, so
  about (pi/4) sqrt(N) iterations find it with high probability and a few more rotate past
  it; on the recorded device the peak falls from 0.945 to 0.715 because the compiled
  circuit is 169 layers deep.

audience:
  reader: "Senior software engineer. Finished chapters 1 to 6. No physics."
  assumes:
    - "Hadamards, phase, measurement (chapters 2 and 6)"
    - "intervals on a frequency (chapter 5)"
  does_not_assume: ["amplitude amplification proofs", "quantum walk theory"]

structure:
  - Opening (3 paragraphs, no headings)
  - Theoretical Foundations (10 subsections)
  - Basic Code Example
  - Common Pitfalls (10-12)
  - Advanced Application Implementation
  - How to run it
  - Reading a Transcript
  - Practical Exercises (requirements only)
  - Solutions (five-part Instructor's Analysis)
  - What this chapter established

theory_subsections:
  - "The task: one marked item among N, and a budget of queries"
  - "The oracle flips a sign, and the diffusion mirrors about the mean"
  - "One iteration is a rotation by 2 theta"
  - "The optimum is round(pi/(4 theta) - 1/2), not round(pi/4 sqrt(N))"
  - "Too many iterations is a real failure, not a metaphor"
  - "What Grover beats, and what beats Grover"
  - "The cost of a general oracle, again"
  - "Depth is the tax: what the device did to a 0.945 peak"
  - "Decision table: search, sort, or index"
  - "A worked derivation: eight items, two iterations, one peak"

artifacts:
  - chapters/chapter07/files/grover.py
  - chapters/chapter07/files/01_oracle.py
  - chapters/chapter07/files/02_iterations.py
  - chapters/chapter07/files/03_optimal.py
  - chapters/chapter07/files/04_hardware.py
  - chapters/chapter07/files/05_classical.py
  - chapters/chapter07/files/run_ex7.py
  - chapters/chapter07/files/exercises/ex1_order.py
  - chapters/chapter07/files/exercises/ex2_multi.py
  - chapters/chapter07/files/exercises/ex3_peak.py
  - chapters/chapter07/files/exercises/ex4_crossover.py
  - chapters/chapter07/files/exercises/plan_core.py
  - chapters/chapter07/files/exercises/plan_render.py
  - chapters/chapter07/files/exercises/ex5_plan.py
  - chapters/chapter07/files/exercises/selfcheck.py
  - chapters/chapter07/files/exercises/run_exercises.py

gates:
  harness: "python3 chapters/chapter07/files/run_ex7.py"
  harness_expected: "52/52 checks passed"
  exercises: "python3 chapters/chapter07/files/exercises/run_exercises.py"
  exercises_expected: "59/59 exercise checks passed"

words: { target: 17000, floor: 14000 }

api_surface:
  grover.py: ["oracle", "diffusion", "uniform", "iterate", "probabilities",
              "success_probability", "optimal_iterations", "approx_iterations",
              "analytic_success", "classical_queries", "binary_search_queries", "theta"]

exercises:
  - id: 1
    title: "The diffusion applied before the oracle"
    kind: repair
    files: [ex1_order.py]
    tests: 9
    problem: "Swapping the two operators lags the rotation by exactly one iteration and still returns a peak."
  - id: 2
    title: "Several marked items"
    kind: extend
    files: [ex2_multi.py]
    tests: 12
    problem: "With M marked items the angle uses sqrt(M/N), and the iteration count changes."
  - id: 3
    title: "What the device's peak is worth"
    kind: measure
    files: [ex3_peak.py]
    tests: 11
    problem: "The simulator says 0.945, the device says 0.715, and the interval has to cover the difference."
  - id: 4
    title: "The iteration count at which the search is worse than guessing"
    kind: break
    files: [ex4_crossover.py]
    tests: 11
    problem: "The success curve is a sine, so it crosses 1/N on the way down; find where."
  - id: 5
    title: "A search plan that separates the model from the report"
    kind: integrate
    files: [plan_core.py, plan_render.py, ex5_plan.py]
    tests: 16
    problem: "Iterations, probability and both classical costs must come out of one computation."

multi_file_exercise:
  id: 5
  files: [plan_core.py, plan_render.py, ex5_plan.py]
  why: >
    plan_core.py is pure (size in, plan out), plan_render.py formats, ex5_plan.py chooses
    the sizes and drops in the recorded device line.

figures:
  - "the state rotating in a two-dimensional plane, by 2 theta per iteration"
  - "success against iterations for eight items, with the overshoot"
  - "queries for linear, Grover and binary search at five sizes"
  - "the file graph"

chapter_notes: >
  The device run is runs/0013-ibm-grover: three qubits, two iterations, marked 101, 1024
  shots, depth 169. The first submission failed because MCZGate does not exist in this
  Qiskit version; the record is the multi-controlled-X construction.
