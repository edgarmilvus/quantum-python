book: "Quantum Python"
chapter: 11
title: "One Interface, Seven Providers"
subtitle: "Four operations, a price list, and a replay that runs without an account"

invariant: >
  Every provider is submit, poll, fetch and cancel behind one interface, and the differences
  that matter are price, capability and failure — three things the interface can expose as
  data without the loop branching on provider.

audience:
  reader: "Senior software engineer. Finished chapters 1 to 10. No cloud experience assumed."
  assumes:
    - "recorded runs and their files (chapters 4 to 10)"
    - "cost accounting and shot budgets (chapter 5)"
  does_not_assume: ["AWS or Azure specifics", "OAuth flows", "distributed job systems"]

structure:
  - Opening (3 paragraphs, no headings)
  - Theoretical Foundations (10 subsections)
  - Basic Code Example
  - Common Pitfalls (10-12)
  - Advanced Application Implementation
  - How to run it
  - Reading a Transcript
  - Practical Exercises (requirements only)
  - Solutions (five-part Instructor's Analysis)
  - What this chapter established

theory_subsections:
  - "The task: the same experiment on four providers"
  - "Four operations, because a job is four things"
  - "The circuit is the book's own type, not the vendor's"
  - "Replay is a backend, not a mock"
  - "Capabilities are data, and they disagree"
  - "Price is per task and per shot, and it is not small"
  - "The guard refuses before the money moves"
  - "Four failures, one handler"
  - "What the interface hides, and what it must not"
  - "Decision table: live, replay, or skip the run"
  - "A worked comparison: one Bell pair on four providers"

artifacts:
  - chapters/chapter11/files/providers/base.py
  - chapters/chapter11/files/providers/replay.py
  - chapters/chapter11/files/providers/budget.py
  - chapters/chapter11/files/providers/registry.py
  - chapters/chapter11/files/providers/ionq.py
  - chapters/chapter11/files/providers/qbraid.py
  - chapters/chapter11/files/providers/ibm.py
  - chapters/chapter11/files/providers/__init__.py
  - chapters/chapter11/files/01_interface.py
  - chapters/chapter11/files/02_live_or_replay.py
  - chapters/chapter11/files/03_capabilities.py
  - chapters/chapter11/files/04_budget.py
  - chapters/chapter11/files/05_failures.py
  - chapters/chapter11/files/run_ex11.py
  - chapters/chapter11/files/exercises/ex1_swallow.py
  - chapters/chapter11/files/exercises/ex2_new_provider.py
  - chapters/chapter11/files/exercises/ex3_cost.py
  - chapters/chapter11/files/exercises/ex4_cap.py
  - chapters/chapter11/files/exercises/plan_core.py
  - chapters/chapter11/files/exercises/plan_render.py
  - chapters/chapter11/files/exercises/ex5_plan.py
  - chapters/chapter11/files/exercises/selfcheck.py
  - chapters/chapter11/files/exercises/run_exercises.py

gates:
  harness: "python3 chapters/chapter11/files/run_ex11.py"
  harness_expected: "45/45 checks passed"
  exercises: "python3 chapters/chapter11/files/exercises/run_exercises.py"
  exercises_expected: "48/48 exercise checks passed"

words: { target: 17000, floor: 14000 }

api_surface:
  base.py: ["Circuit", "Profile", "Job", "Result", "Backend", "BackendError"]
  replay.py: ["Replay"]
  budget.py: ["Price", "PRICES", "Ledger"]
  registry.py: ["SPECS", "configured", "make", "status_table", "ledger"]

exercises:
  - id: 1
    title: "An adapter that swallows the error"
    kind: repair
    files: [ex1_swallow.py]
    tests: 8
    problem: "A wrapper returns an empty result when the provider fails, so downstream code sees zero shots instead of a failure."
  - id: 2
    title: "A new provider, added without touching the loop"
    kind: extend
    files: [ex2_new_provider.py]
    tests: 7
    problem: "One spec, one price, one class; the loop must not change."
  - id: 3
    title: "What the book's own runs would have cost on a QPU"
    kind: measure
    files: [ex3_cost.py]
    tests: 13
    problem: "The six recorded runs cost nothing and would cost 3,488 dollars on a paid QPU."
  - id: 4
    title: "The shot count at which the cap refuses"
    kind: break
    files: [ex4_cap.py]
    tests: 13
    problem: "Five dollars buys 58 IonQ shots or 2,937 Braket shots, and the 59th is refused."
  - id: 5
    title: "A verdict per run, from three recorded providers"
    kind: integrate
    files: [plan_core.py, plan_render.py, ex5_plan.py]
    tests: 10
    problem: "The same loop must read three cases through one interface and print a verdict each."

multi_file_exercise:
  id: 5
  files: [plan_core.py, plan_render.py, ex5_plan.py]
  why: >
    plan_core.py is pure (a result and an expectation in, a verdict out), plan_render.py
    formats, ex5_plan.py builds backends and prints.

figures:
  - "the four operations and the two implementations behind them"
  - "the layers: chapter code, interface, adapters, providers"
  - "the replay loop: file, backend, result, identical downstream"
  - "the budget gate before the submit"

chapter_notes: >
  The live path was exercised once against IonQ's simulator (free) and produced {00: 0.5,
  11: 0.5}; the recorded path reproduces ibm_fez's four outcomes. The chapter's cost table is
  from the providers' published pages in November 2026.
