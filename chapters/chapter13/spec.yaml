book: "Quantum Python"
chapter: 13
title: "QAOA and Combinatorial Optimization"
subtitle: "A phase separator, a mixer, and a landscape worth 12 seconds of hardware"

invariant: >
  QAOA turns a graph into a circuit whose two angles per layer trade off
  exploration against exploitation, and the number it reports is a property of
  the optimiser as much as of the ansatz.

audience:
  reader: "Senior software engineer. Finished chapters 1 to 12. Knows what a bitstring measurement is."
  assumes:
    - "statevectors and measurement (chapters 2 and 4)"
    - "the cost of a circuit in shots and seconds (chapters 5 and 12)"
    - "a device's noise compresses what it measures (chapter 12)"
  does_not_assume: ["graph theory beyond a cut", "constrained optimisation", "quantum annealing"]

structure:
  - Opening (3 paragraphs, no headings)
  - Theoretical Foundations (11 subsections)
  - Basic Code Example
  - Common Pitfalls (12)
  - Advanced Application Implementation
  - How to run it
  - Reading a Transcript
  - Practical Exercises (requirements only)
  - Solutions (five-part Instructor's Analysis)
  - What this chapter established

theory_subsections:
  - "The task: MaxCut on a square with one diagonal"
  - "What a cut is, and why four vertices is the right size"
  - "The circuit: a phase separator and a mixer"
  - "Why the separator is diagonal, and what that buys and costs"
  - "The landscape is smooth, periodic and not convex"
  - "Layers buy expressiveness; restarts buy luck"
  - "The gradient costs circuits, not memory"
  - "The optimiser sees a noisy objective"
  - "What the device did to the landscape"
  - "What an approximation ratio does and does not claim"
  - "Decision table: simulate, scan, or optimise on hardware"

artifacts:
  - chapters/chapter13/files/qaoa/graph.py
  - chapters/chapter13/files/qaoa/state.py
  - chapters/chapter13/files/qaoa/qaoa.py
  - chapters/chapter13/files/qaoa/optimize.py
  - chapters/chapter13/files/qaoa/__init__.py
  - chapters/chapter13/files/01_cut.py
  - chapters/chapter13/files/02_state.py
  - chapters/chapter13/files/03_landscape.py
  - chapters/chapter13/files/04_layers.py
  - chapters/chapter13/files/05_hardware.py
  - chapters/chapter13/files/06_budget.py
  - chapters/chapter13/files/run_ex13.py
  - chapters/chapter13/files/exercises/ex1_sign.py
  - chapters/chapter13/files/exercises/ex2_weights.py
  - chapters/chapter13/files/exercises/ex3_budget.py
  - chapters/chapter13/files/exercises/ex4_order.py
  - chapters/chapter13/files/exercises/plan_core.py
  - chapters/chapter13/files/exercises/plan_render.py
  - chapters/chapter13/files/exercises/ex5_plan.py
  - chapters/chapter13/files/exercises/selfcheck.py
  - chapters/chapter13/files/exercises/run_exercises.py

gates:
  harness: "python3 chapters/chapter13/files/run_ex13.py"
  harness_expected: "73/73 checks passed"
  exercises: "python3 chapters/chapter13/files/exercises/run_exercises.py"
  exercises_expected: "89/89 exercise checks passed"

words: { target: 19000, floor: 14000 }

api_surface:
  graph: ["Graph", "square_with_diagonal", "ring", "weighted_square", "complete"]
  state: ["zero", "h", "rx", "rz", "rzz", "probabilities", "sample", "norm"]
  qaoa: ["state_for", "circuit_ops", "zz", "expected_cut", "distribution_over_cuts", "expected_cut_from_counts", "cut_sigma", "approximation_ratio", "gradient", "counts_to_bits"]
  optimize: ["Point", "grid_search", "landscape", "nelder_mead", "optimise", "shots_to_resolve", "budget"]

exercises:
  - id: 1
    title: "A cost function with the sign flipped"
    kind: repair
    files: [ex1_sign.py]
    tests: 13
    problem: "(1 + ZZ)/2 counts the edges that stay inside a side, so the optimiser maximises the complement and reports a ratio above one."
  - id: 2
    title: "A heavy edge moves the optimum and the angles"
    kind: extend
    files: [ex2_weights.py]
    tests: 18
    problem: "Weight three on one edge raises the optimum from 4 to 6, and the unweighted angles lose three points of ratio on the weighted instance."
  - id: 3
    title: "What one optimisation costs before it starts"
    kind: measure
    files: [ex3_budget.py]
    tests: 26
    problem: "Twelve circuits a gradient at p=1, 240 for twenty steps, and four layers do not fit a five-minute allowance."
  - id: 4
    title: "The mixer before the phase separator"
    kind: break
    files: [ex4_order.py]
    tests: 15
    problem: "A diagonal gate applied last cannot change a computational-basis measurement, so the landscape is flat at exactly 2.5."
  - id: 5
    title: "One report from an optimisation and a device run"
    kind: integrate
    files: [plan_core.py, plan_render.py, ex5_plan.py]
    tests: 17
    problem: "Mean cut, ratio, most likely assignment and the measured peak, in a report the pure file computes and the wiring prints."

multi_file_exercise:
  id: 5
  files: [plan_core.py, plan_render.py, ex5_plan.py]
  why: >
    plan_core.py is pure (a graph and angles in, a summary out), plan_render.py formats,
    ex5_plan.py optimises, reads run 0022 and prints.

figures:
  - "the one-layer circuit: Hadamards, five separators, four mixers"
  - "the landscape on a 6 by 6 grid, neutral at the uniform mean"
  - "the approximation ratio against the layer count"
  - "the same p=2 circuit under one, four and eight restarts"
  - "the simulated and measured surfaces, and the point they share"

runs:
  - "runs/0022-ibm-fez-qaoa/result.json (36 circuits, one job, 12 seconds of runtime)"

chapter_notes: >
  The hardware experiment is one job of 36 circuits on ibm_marrakesh at 1,024 shots,
  recorded once and replayed by the chapter. It is a slice of the landscape, not an
  optimisation: the optimiser needs hundreds of evaluations and the account had 576
  seconds. The simulated optimiser's numbers are exact and deterministic.
